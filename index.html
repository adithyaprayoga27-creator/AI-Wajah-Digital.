<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADIT AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #020609;
  color: #00f5ff;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

h1 {
  letter-spacing: 8px;
  text-shadow: 0 0 15px #00f5ff;
}

.face {
  width: 230px;
  height: 280px;
  border: 2px solid #00cfff;
  border-radius: 48% 48% 42% 42%;
  box-shadow: 0 0 30px #0077ff, inset 0 0 30px #003cff;
  animation: float 3s infinite ease-in-out;
}

.eyes {
  display: flex;
  justify-content: space-around;
  margin-top: 90px;
}

.eye {
  width: 48px;
  height: 15px;
  background: #39ff14;
  border-radius: 50%;
  box-shadow: 0 0 20px #39ff14;
  animation: blink 4s infinite;
}

.mouth {
  width: 65px;
  height: 4px;
  background: #00f5ff;
  margin: 55px auto;
}

button {
  margin: 10px;
  padding: 14px 22px;
  border: 1px solid #00f5ff;
  background: #041923;
  color: #00f5ff;
  border-radius: 30px;
  font-size: 16px;
}

#status { color: #8affc1; }

@keyframes float {
  50% { transform: translateY(-10px); }
}

@keyframes blink {
  0%, 45%, 50%, 100% { transform: scaleY(1); }
  47%, 48% { transform: scaleY(.1); }
}
</style>
</head>

<body>
<h1>ADIT AI</h1>
<p>ASISTEN AI PRIBADIMU</p>

<div class="face">
  <div class="eyes">
    <div class="eye"></div>
    <div class="eye"></div>
  </div>
  <div class="mouth"></div>
</div>

<button onclick="listen()">🎤 BICARA</button>
<button onclick="speak('Halo! Saya Adit AI. Ada yang bisa saya bantu?')">
